name: Warm release cache

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-release
          cache-on-failure: true

      - name: Build release binary
        run: cargo build --release

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-release
          cache-on-failure: true

      # 캐시 키를 `release.yml`과 맞추려면 타깃·프로파일이 동일해야 하므로,
      # 패키징을 하는 `scripts/build-macos.sh` 대신 cargo 만 돌린다.
      - name: Build aarch64-apple-darwin release binary
        run: cargo build --release --target aarch64-apple-darwin
